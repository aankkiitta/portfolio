<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Portfolio Loader · Cinematic</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050505;
      min-height: 100vh;
      font-family: 'Sora', 'Poppins', system-ui, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* ===== PRELOADER ===== */
    .preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #050505;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      pointer-events: none;
      transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1),
                  transform 1.2s cubic-bezier(0.23, 1, 0.32, 1),
                  backdrop-filter 1.2s ease;
      will-change: transform, opacity;
      opacity: 1;
      backdrop-filter: blur(0px);
      transform: scale(1);
    }

    .preloader.fade-out {
      opacity: 0;
      backdrop-filter: blur(16px);
      transform: scale(1.05);
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      padding: 0 24px;
      position: relative;
    }

    /* ===== GLOWING PARTICLES ===== */
    .particles-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(110, 231, 255, 0.12), transparent 70%);
      filter: blur(2px);
      animation: floatParticle 14s ease-in-out infinite alternate;
    }

    .particle:nth-child(1) { width: 140px; height: 140px; top: 8%; left: 3%; animation-delay: 0s; }
    .particle:nth-child(2) { width: 100px; height: 100px; bottom: 15%; right: 5%; animation-delay: 2s; }
    .particle:nth-child(3) { width: 180px; height: 180px; top: 55%; left: 1%; animation-delay: 4s; }
    .particle:nth-child(4) { width: 80px; height: 80px; bottom: 8%; left: 35%; animation-delay: 1s; }
    .particle:nth-child(5) { width: 60px; height: 60px; top: 25%; right: 15%; animation-delay: 3s; }

    @keyframes floatParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
      100% { transform: translate(50px, -40px) scale(1.8); opacity: 0.5; }
    }

    /* ===== PHASE 1 ===== */
    .phase-1 {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .phase-1.hide {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      position: absolute;
    }

    .main-title {
      font-family: 'Sora', 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 5vw, 3.4rem);
      letter-spacing: 4px;
      text-align: center;
      white-space: nowrap;
      background: linear-gradient(135deg, #6EE7FF 0%, #8B5CF6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 80px rgba(110, 231, 255, 0.3), 0 0 160px rgba(139, 92, 246, 0.2);
      opacity: 0;
      transform: scale(0.85);
      animation: titleReveal 1.6s cubic-bezier(0.23, 1, 0.32, 1) 0.3s forwards;
      will-change: transform, opacity;
      line-height: 1.2;
      padding: 0 8px;
    }

    @keyframes titleReveal {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    .subtitle-text {
      font-family: 'Poppins', 'Sora', sans-serif;
      font-weight: 300;
      font-size: clamp(0.85rem, 1.5vw, 1.25rem);
      color: #b8b8b8;
      text-align: center;
      max-width: 700px;
      margin-top: 24px;
      line-height: 1.7;
      letter-spacing: 0.3px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.9s cubic-bezier(0.23, 1, 0.32, 1),
                  transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .subtitle-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    .tech-grid {
      margin-top: 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px 28px;
      width: 100%;
      max-width: 820px;
      min-height: 100px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .tech-grid.show {
      opacity: 1;
    }

    .tech-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transform: scale(0);
      transition: filter 0.3s ease, transform 0.3s ease;
      will-change: transform;
      cursor: default;
    }

    .tech-item.visible {
      opacity: 1;
      transform: scale(1);
      animation: techBounce 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .tech-item:hover {
      filter: drop-shadow(0 0 18px rgba(110, 231, 255, 0.2));
      transform: translateY(-3px);
    }

    .tech-item i {
      font-size: 2.4rem;
      transition: transform 0.3s ease;
      display: block;
    }

    .tech-item:hover i {
      transform: scale(1.08);
    }

    .tech-label {
      font-family: 'Poppins', 'Sora', sans-serif;
      font-weight: 400;
      font-size: 0.55rem;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 2px;
    }

    @keyframes techBounce {
      0% { opacity: 0; transform: scale(0) rotate(-2deg); }
      70% { opacity: 1; transform: scale(1.10) rotate(0.5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    .progress-wrap {
      margin-top: 36px;
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .progress-wrap.show {
      opacity: 1;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(110, 231, 255, 0.02);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6EE7FF, #8B5CF6);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(110, 231, 255, 0.15);
      transition: width 0.08s linear;
    }

    .progress-label {
      margin-top: 14px;
      font-family: 'Poppins', 'Sora', sans-serif;
      font-weight: 300;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.3);
      transition: color 0.4s ease;
    }

    .progress-label.done {
      color: rgba(255, 255, 255, 0.6);
    }

    /* ===== PHASE 2: Name + Title on same line ===== */
    .dual-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem 1rem;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 0.5rem;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .dual-line.show {
      opacity: 1;
    }

    .dual-line .role {
      font-family: 'Sora', 'Poppins', sans-serif;
      font-weight: 500;
      font-size: clamp(0.85rem, 2vw, 1.6rem);
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, #6EE7FF, #8B5CF6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
    }

    .dual-line .separator {
      font-weight: 200;
      color: rgba(255, 255, 255, 0.15);
      font-size: clamp(1rem, 2.2vw, 1.8rem);
      white-space: nowrap;
    }

    .dual-line .name-mask {
      font-family: 'Sora', 'Poppins', sans-serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 9vw, 5.5rem);
      letter-spacing: 1px;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 0%, #6EE7FF 30%, #3b82f6 60%, #8B5CF6 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmerGlow 8s ease-in-out infinite alternate;
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 100%);
      mask-image: linear-gradient(to right, #000 0%, #000 100%);
      -webkit-mask-size: 0% 100%;
      mask-size: 0% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: 0% 0%;
      mask-position: 0% 0%;
      animation: maskReveal 1.5s cubic-bezier(0.23, 1, 0.32, 1) forwards, shimmerGlow 8s ease-in-out infinite alternate 1.6s;
      text-shadow: 0 0 60px rgba(110, 231, 255, 0.2), 0 0 120px rgba(139, 92, 246, 0.1);
      white-space: nowrap;
    }

    @keyframes maskReveal {
      0% { -webkit-mask-size: 0% 100%; mask-size: 0% 100%; }
      100% { -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
    }

    @keyframes shimmerGlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .name-desc {
      font-family: 'Poppins', 'Sora', sans-serif;
      font-weight: 300;
      font-size: clamp(0.8rem, 1.2vw, 1.05rem);
      color: #aaa;
      text-align: center;
      max-width: 700px;
      margin-top: 20px;
      line-height: 1.7;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      padding: 0 16px;
    }

    .name-desc.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== MOBILE SPECIFIC FIXES ===== */
    @media (max-width: 640px) {
      .tech-item i { font-size: 1.8rem; }
      .tech-grid { gap: 10px 14px; }
      .tech-label { font-size: 0.45rem; }
      .main-title { 
        font-size: clamp(1.2rem, 4.5vw, 1.8rem); 
        letter-spacing: 2px; 
        white-space: nowrap;
      }
      .subtitle-text { font-size: 0.8rem; }
      
      /* Mobile: stack role and name vertically for better readability */
      .dual-line {
        flex-direction: column;
        align-items: center;
        gap: 0.2rem 0;
      }
      .dual-line .separator {
        display: none; /* hide bullet on mobile */
      }
      .dual-line .role {
        font-size: clamp(0.7rem, 2.5vw, 0.9rem);
        letter-spacing: 2px;
        white-space: nowrap;
      }
      .dual-line .name-mask {
        font-size: clamp(1.8rem, 10vw, 3rem);
        letter-spacing: 0.5px;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis; /* fallback if too long */
      }
      .name-desc {
        font-size: 0.75rem;
        padding: 0 12px;
        margin-top: 12px;
      }
    }

    /* Extra small screens */
    @media (max-width: 380px) {
      .dual-line .name-mask {
        font-size: clamp(1.4rem, 8vw, 2.2rem);
        letter-spacing: 0px;
      }
      .dual-line .role {
        font-size: 0.65rem;
        letter-spacing: 1px;
      }
      .main-title {
        font-size: clamp(1rem, 4vw, 1.4rem);
        letter-spacing: 1px;
      }
    }

    /* reveal for actual portfolio (hidden initially) */
    .portfolio-content {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .portfolio-content.reveal {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- GLOWING PARTICLES -->
  <div class="particles-bg">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- ===== PRELOADER ===== -->
  <div class="preloader" id="preloader">
    <div class="loader-content">

      <!-- FIRST SCREEN -->
      <div class="phase-1" id="phase1">
        <div class="main-title" id="mainTitle">
          FULL STACK DEVELOPER
        </div>

        <div class="subtitle-text" id="subtitleText">
          Building Responsive, Scalable &amp; Modern Web Applications
          with Clean Code and Great User Experience.
        </div>

        <div class="tech-grid" id="techGrid"></div>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-label" id="progressLabel">
            Loading Portfolio...
          </div>
        </div>
      </div>

      <!-- SECOND SCREEN: DUAL LINE (role + name) -->
      <div class="dual-line" id="dualLine" style="display:none;">
        <span class="role">FULL STACK DEVELOPER</span>
        <span class="separator">•</span>
        <span class="name-mask">ANKITA CHAUHAN</span>
      </div>

      <div class="name-desc" id="nameDesc" style="display:none;">
        Building Responsive, Scalable &amp; Modern Web Applications
        with Clean Code and Great User Experience.
      </div>

    </div>
  </div>



  <script>
    (function() {
      "use strict";

      // ----- DOM refs -----
      const preloader = document.getElementById('preloader');
      const phase1 = document.getElementById('phase1');
      const mainTitle = document.getElementById('mainTitle');
      const subtitleText = document.getElementById('subtitleText');
      const techGrid = document.getElementById('techGrid');
      const progressWrap = document.getElementById('progressWrap');
      const progressFill = document.getElementById('progressFill');
      const progressLabel = document.getElementById('progressLabel');
      const dualLine = document.getElementById('dualLine');
      const nameDesc = document.getElementById('nameDesc');
      const portfolioContent = document.getElementById('portfolioContent');

      // ----- Tech data -----
      const techData = [
        { name: 'HTML5', icon: 'fab fa-html5', color: '#e44d26' },
        { name: 'CSS3', icon: 'fab fa-css3-alt', color: '#2965f1' },
        { name: 'JavaScript', icon: 'fab fa-js', color: '#f7df1e' },
        { name: 'React', icon: 'fab fa-react', color: '#61dafb' },
        { name: 'Node.js', icon: 'fab fa-node', color: '#339933' },
        { name: 'Express.js', icon: 'fas fa-server', color: '#68a063' },
        { name: 'MySQL', icon: 'fas fa-database', color: '#00758f' },
        { name: 'Git', icon: 'fab fa-git-alt', color: '#f05033' },
        { name: 'GitHub', icon: 'fab fa-github', color: '#ffffff' }
      ];

      // ----- Build tech grid -----
      function buildTechGrid() {
        techData.forEach((tech) => {
          const item = document.createElement('div');
          item.className = 'tech-item';
          item.innerHTML = `
            <i class="${tech.icon}" style="color: ${tech.color};"></i>
            <span class="tech-label">${tech.name}</span>
          `;
          techGrid.appendChild(item);
        });
      }

      // ----- Show tech icons one by one -----
      function showTechIcons() {
        return new Promise((resolve) => {
          const items = techGrid.querySelectorAll('.tech-item');
          techGrid.classList.add('show');
          items.forEach((item, index) => {
            setTimeout(() => {
              item.classList.add('visible');
            }, index * 150);
          });
          const totalDelay = items.length * 150 + 300;
          setTimeout(resolve, totalDelay);
        });
      }

      // ----- Progress bar animation -----
      function animateProgress(duration = 3000) {
        return new Promise((resolve) => {
          let startTime = null;
          const fill = progressFill;
          const label = progressLabel;

          function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = progress < 0.5
              ? 4 * progress * progress * progress
              : 1 - Math.pow(-2 * progress + 2, 3) / 2;
            fill.style.width = (eased * 100) + '%';

            if (eased < 0.99) {
              label.textContent = 'Loading Portfolio...';
              label.classList.remove('done');
            } else {
              label.textContent = 'Welcome.';
              label.classList.add('done');
            }

            if (progress < 1) {
              requestAnimationFrame(step);
            } else {
              resolve();
            }
          }
          requestAnimationFrame(step);
        });
      }

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      // ===== MAIN SEQUENCE =====
      async function runSequence() {
        buildTechGrid();

        // STEP 1: title already animates via CSS (fade+scale)
        await wait(2000);

        // STEP 2: show description
        subtitleText.classList.add('show');
        await wait(1500);

        // STEP 3: show tech icons one by one
        await showTechIcons();
        await wait(1200);

        // STEP 4: show progress bar + animate
        progressWrap.classList.add('show');
        await animateProgress(3000);
        await wait(1000);

        // STEP 5: fade out phase1 (title, desc, tech, progress) together
        phase1.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
        phase1.style.opacity = '0';
        phase1.style.transform = 'scale(0.96)';
        await wait(900);
        phase1.style.display = 'none';

        // STEP 6: reveal dual line (role + name) with mask reveal
        dualLine.style.display = 'flex';
        void dualLine.offsetWidth;
        dualLine.classList.add('show');
        await wait(1600);

        // STEP 7: show description below name
        nameDesc.style.display = 'block';
        void nameDesc.offsetWidth;
        nameDesc.classList.add('show');
        await wait(800);

        // STEP 8: keep visible for 2s
        await wait(2000);

       // Loader finish -> Direct Portfolio
preloader.classList.add('fade-out');
await wait(1200);

preloader.remove();
document.body.style.overflow = 'auto';

// Open main portfolio
window.location.href = "index.html";
      }

      runSequence();

      // Safety net
      setTimeout(() => {
        if (!preloader.classList.contains('fade-out')) {
          progressFill.style.width = '100%';
          progressLabel.textContent = 'Welcome.';
          progressLabel.classList.add('done');
          preloader.classList.add('fade-out');
          setTimeout(() => {
            preloader.style.display = 'none';
            document.body.style.overflow = 'auto';
            portfolioContent.classList.add('reveal');
          }, 1200);
        }
      }, 18000);

    })();
  </script>

</body>
</html>
