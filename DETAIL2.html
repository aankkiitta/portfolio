<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Project Case Study · Ankita Chauhan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ==================================================
           CSS VARIABLES
        ================================================== */
        :root {
            --bg-primary: #f8faff;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.7);
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border-color: rgba(108, 77, 255, 0.08);
            --shadow-sm: 0 12px 40px -8px rgba(108, 77, 255, 0.06);
            --shadow-md: 0 20px 60px -12px rgba(108, 77, 255, 0.10);
            --shadow-lg: 0 40px 80px -16px rgba(108, 77, 255, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(108, 77, 255, 0.10);
            --primary: #6C4DFF;
            --secondary: #8B5CFF;
            --primary-light: #8b6fff;
            --light-purple: #F3F0FF;
            --radius-lg: 28px;
            --radius-pill: 60px;
            --transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --font-serif: 'Georgia', 'Times New Roman', serif;
        }

        [data-theme="dark"] {
            --bg-primary: #0B1120;
            --bg-secondary: #0F172A;
            --bg-card: rgba(15, 23, 42, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(148, 163, 184, 0.08);
            --shadow-sm: 0 12px 40px -8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 20px 60px -12px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 40px 80px -16px rgba(0, 0, 0, 0.6);
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(148, 163, 184, 0.08);
            --light-purple: rgba(108, 77, 255, 0.15);
        }

        /* ==================================================
           BASE
        ================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background 0.5s, color 0.5s;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ==================================================
           NAVBAR
        ================================================== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 78px;
            padding: 0 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            transition: var(--transition);
        }

        nav.scrolled {
            background: var(--bg-secondary);
            box-shadow: var(--shadow-md);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
            transition: color 0.5s;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: -0.5px;
            box-shadow: 0 4px 12px rgba(108, 77, 255, 0.25);
        }

        .nav-links {
            display: flex;
            gap: 2.2rem;
            font-weight: 500;
            font-size: 0.9rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            transition: var(--transition);
            position: relative;
            padding: 0.2rem 0;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary);
        }

        .nav-connect {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff !important;
            padding: 0.5rem 1.6rem !important;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 16px rgba(108, 77, 255, 0.25);
            transition: var(--transition);
        }

        .nav-connect:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 28px rgba(108, 77, 255, 0.35);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: var(--transition);
            background: var(--bg-card);
        }

        .theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: rotate(30deg);
        }

        @media (max-width: 768px) {
            nav {
                padding: 0 20px;
                height: 68px;
            }
            .nav-links {
                display: none;
            }
        }

        /* ==================================================
           BACK BUTTON
        ================================================== */
        .back-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            height: 48px;
            border-radius: 16px;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
            transition: .3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            color: var(--primary);
            border-color: var(--primary);
        }

        [data-theme="dark"] .back-btn {
            background: rgba(15, 23, 42, .88);
            border: 1px solid rgba(255, 255, 255, .08);
            color: #F8FAFC;
        }
        [data-theme="dark"] .back-btn:hover {
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .back-btn {
                width: 52px;
                height: 52px;
                min-width: 52px;
                padding: 0;
                border-radius: 50%;
                justify-content: center;
                bottom: 18px;
                left: 18px;
            }
            .back-btn span {
                display: none;
            }
            .back-btn i {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .back-btn {
                width: 44px;
                height: 44px;
                min-width: 44px;
                bottom: 14px;
                left: 14px;
            }
            .back-btn i {
                font-size: 16px;
            }
        }

        /* ==================================================
           CASE STUDY
        ================================================== */
        #case-study {
            padding: 7rem 0 4rem;
            background: var(--bg-primary);
            position: relative;
            z-index: 2;
            transition: background 0.5s;
            min-height: 100vh;
        }

        /* Loading & Error */
        .loading-state,
        .error-state,
        .not-found-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            min-height: 400px;
        }

        .loading-state .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-state p,
        .error-state p,
        .not-found-state p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .error-state i,
        .not-found-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .error-state i {
            color: #ef4444;
        }
        .not-found-state i {
            color: var(--text-muted);
        }

        .error-state small {
            display: block;
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* ==================================================
           CASE STUDY SECTIONS
        ================================================== */

        /* Hero */
        .case-hero {
            padding: 0 0 4rem;
            position: relative;
        }

        .case-hero-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .case-hero-content .category-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: inline-block;
            padding: 4px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            background: var(--light-purple);
        }

        .case-hero-content h1 {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            line-height: 1.05;
            margin-bottom: 0.75rem;
            transition: color 0.5s;
        }

        .case-hero-content .tagline {
            font-size: 1.2rem;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 480px;
            margin-bottom: 1.5rem;
            transition: color 0.5s;
        }

        .case-hero-content .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem 2.5rem;
            margin-bottom: 1.5rem;
        }

        .case-hero-content .hero-meta .meta-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .case-hero-content .hero-meta .meta-item .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .case-hero-content .hero-meta .meta-item .value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.5s;
        }

        .case-hero-content .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 0.5rem;
        }

        .case-hero-image {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            background: var(--light-purple);
            box-shadow: var(--shadow-lg);
            transition: box-shadow 0.5s;
        }

        .case-hero-image::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle, rgba(108, 77, 255, 0.06), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .case-hero-image img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
        }

        .case-hero-image .image-placeholder {
            width: 100%;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.3;
            position: relative;
            z-index: 1;
        }

        /* Buttons */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            box-shadow: 0 4px 16px rgba(108, 77, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(108, 77, 255, 0.35);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1.5px solid var(--border-color);
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
        }

        /* ==================================================
           CASE SECTIONS
        ================================================== */
        .case-section {
            padding: 4rem 0;
            border-top: 1px solid var(--border-color);
        }

        .case-section:first-of-type {
            border-top: none;
            padding-top: 0;
        }

        .case-section .section-number {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .case-section h2 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            transition: color 0.5s;
        }

        .case-section p {
            color: var(--text-secondary);
            line-height: 1.9;
            font-size: 1.1rem;
            max-width: 800px;
            transition: color 0.5s;
        }

        .case-section .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            margin-top: 1rem;
        }

        .case-section .grid-2col p {
            max-width: 100%;
        }

        /* Split Layout */
        .split-layout {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 3rem;
            align-items: start;
        }

        .split-layout .split-left .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
        }

        .split-layout .split-left .number {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            opacity: 0.15;
            line-height: 1;
            margin-top: 0.25rem;
        }

        .split-layout .split-right p {
            font-size: 1.15rem;
            line-height: 1.9;
            color: var(--text-secondary);
            transition: color 0.5s;
        }

        .split-layout .split-right .meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all 0.5s;
        }

        .split-layout .split-right .meta-grid .m-item .m-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .split-layout .split-right .meta-grid .m-item .m-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            transition: color 0.5s;
        }

        /* Quote Style */
        .quote-text {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.7;
            color: var(--text-primary);
            padding: 1.5rem 2rem;
            border-left: 4px solid var(--primary);
            background: var(--bg-card);
            border-radius: 0 16px 16px 0;
            transition: all 0.5s;
            font-family: var(--font-serif);
        }

        /* Features Numbered List */
        .feature-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .feature-item {
            display: grid;
            grid-template-columns: 48px 1fr;
            gap: 1.2rem;
            padding: 1.2rem 1.5rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            align-items: start;
        }

        .feature-item:hover {
            transform: translateX(6px);
            border-color: var(--primary);
        }

        .feature-item .f-number {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            opacity: 0.5;
        }

        .feature-item .f-content h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 2px;
            transition: color 0.5s;
        }

        .feature-item .f-content p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.6;
            max-width: 100%;
            transition: color 0.5s;
        }

        /* Tech Stack */
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .tech-category {
            padding: 1.5rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            transition: all var(--transition);
        }

        .tech-category:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .tech-category .cat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .tech-category .cat-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tech-category .cat-items .tech-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            background: var(--light-purple);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .tech-category .cat-items .tech-tag i {
            color: var(--primary);
            font-size: 0.85rem;
        }

        .tech-category .cat-items .tech-tag:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 77, 255, 0.1);
        }

        /* Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .gallery-grid .gallery-main {
            grid-row: span 2;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            background: var(--light-purple);
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            aspect-ratio: 4/3;
            position: relative;
        }

        .gallery-grid .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-grid .gallery-main:hover img {
            transform: scale(1.03);
        }

        .gallery-grid .gallery-main .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-grid .gallery-main:hover .overlay {
            opacity: 1;
        }

        .gallery-grid .gallery-main .overlay i {
            color: #fff;
            font-size: 2.5rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 50%;
        }

        .gallery-grid .gallery-thumb {
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            background: var(--light-purple);
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            aspect-ratio: 16/10;
            position: relative;
        }

        .gallery-grid .gallery-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-grid .gallery-thumb:hover img {
            transform: scale(1.05);
        }

        .gallery-grid .gallery-thumb .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-grid .gallery-thumb:hover .overlay {
            opacity: 1;
        }

        .gallery-grid .gallery-thumb .overlay i {
            color: #fff;
            font-size: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 14px;
            border-radius: 50%;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 2.5rem;
            margin-top: 1.5rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-step {
            position: relative;
            padding: 0 0 2rem 2.5rem;
        }

        .timeline-step:last-child {
            padding-bottom: 0;
        }

        .timeline-step::before {
            content: '';
            position: absolute;
            left: -1.9rem;
            top: 8px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--bg-primary);
            transition: border-color 0.5s;
        }

        .timeline-step .step-number {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .timeline-step .step-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            transition: color 0.5s;
        }

        .timeline-step .step-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
            transition: color 0.5s;
        }

        /* Challenges */
        .challenge-item {
            display: grid;

    <script>
        // ==================================================
        // THEME TOGGLE
        // ==================================================
        (function() {
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const html = document.documentElement;
            const get = () => localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ?
                'dark' : 'light');
            const set = (t) => { html.setAttribute('data-theme', t);
                localStorage.setItem('theme', t);
                icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon'; };
            set(get());
            toggle.addEventListener('click', () => { const cur = html.getAttribute('data-theme');
                set(cur === 'dark' ? 'light' : 'dark'); });
        })();

        // ==================================================
        // NAVBAR SCROLL
        // ==================================================
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 20); });

        // ==================================================
        // API CONFIGURATION
        // ==================================================
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ?
            'http://localhost:5000' :
            'https://portfolio-3-l63x.onrender.com';

        const API_URL = `${API_BASE_URL}/api`;

        console.log('🌐 Environment:', window.location.hostname === 'localhost' ? 'Local' : 'Production');
        console.log('📡 API Base URL:', API_BASE_URL);

        // ==================================================
        // LIGHTBOX
        // ==================================================
        (function() {
            const lightbox = document.getElementById('lightbox');
            const lightboxImage = document.getElementById('lightboxImage');
            const lightboxClose = document.getElementById('lightboxClose');
            const lightboxPrev = document.getElementById('lightboxPrev');
            const lightboxNext = document.getElementById('lightboxNext');
            const lightboxCounter = document.getElementById('lightboxCounter');
            let currentImages = [];
            let currentIndex = 0;

            function openLightbox(images, index) {
                currentImages = images.map(img => {
                    if (img.image_path && !img.image_path.startsWith('http')) {
                        return `${API_BASE_URL}${img.image_path}`;
                    }
                    return img.image_path || img.src;
                });
                currentIndex = index;
                lightboxImage.src = currentImages[index];
                lightboxCounter.textContent = `${index + 1} / ${currentImages.length}`;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
            }

            function goTo(index) {
                currentIndex = (index + currentImages.length) % currentImages.length;
                lightboxImage.src = currentImages[currentIndex];
                lightboxCounter.textContent = `${currentIndex + 1} / ${currentImages.length}`;
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            lightboxPrev.addEventListener('click', (e) => {
                e.stopPropagation();
                goTo(currentIndex - 1);
            });

            lightboxNext.addEventListener('click', (e) => {
                e.stopPropagation();
                goTo(currentIndex + 1);
            });

            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
                if (e.key === 'ArrowRight') goTo(currentIndex + 1);
            });

            window.openLightbox = openLightbox;
        })();

        // ==================================================
        // GET PROJECT ID FROM URL
        // ==================================================
        function getProjectId() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            console.log('🔎 Project ID from URL:', id);
            return id;
        }

        // ==================================================
        // SHOW ERROR
        // ==================================================
        function showError(message, title = 'Project Not Found') {
            const container = document.getElementById('caseContent');
            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>${title}</p>
                    <small>${message}</small>
                    <a href="index.html#projects" class="btn-primary" style="margin-top:1.5rem; display:inline-flex; align-items:center; gap:10px;">
                        <i class="fas fa-arrow-left"></i> Back to Projects
                    </a>
                </div>
            `;
            document.title = `${title} · Ankita Chauhan`;
        }

        // ==================================================
        // FETCH PROJECT BY ID
        // ==================================================
        async function fetchProjectById() {
            const projectId = getProjectId();
            const content = document.getElementById('caseContent');

            if (!projectId) {
                showError('Project ID is missing.', 'No Project Specified');
                return;
            }

            const idNum = Number(projectId);
            if (!Number.isInteger(idNum) || idNum <= 0) {
                showError('Invalid project ID format.', 'Invalid ID');
                return;
            }

            try {
                // Show loading
                content.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading project details...</p>
                    </div>
                `;

                const url = `${API_URL}/projects/${idNum}`;
                console.log('🌐 Fetching:', url);

                const response = await fetch(url);
                console.log('📡 Response status:', response.status);

                if (response.status === 404) {
                    showError('The requested project does not exist in the database.', 'Project Not Found');
                    return;
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('📦 API response:', data);

                let project = null;
                if (data.success && data.project) {
                    project = data.project;
                } else if (data.id || data.project_name) {
                    project = data;
                } else if (data.success === false) {
                    throw new Error(data.message || 'Failed to load project');
                }

                if (!project) {
                    throw new Error('Invalid response format from server');
                }

                console.log('✅ Project received:', project);
                renderProject(project);

            } catch (error) {
                console.error('❌ Error:', error);
                showError(error.message, 'Unable to Load Project');
            }
        }

        // ==================================================
        // RENDER PROJECT
        // ==================================================
        function renderProject(project) {
            const container = document.getElementById('caseContent');
            document.title = `${project.project_name} · Case Study · Ankita Chauhan`;

            // Status
            const status = project.status || 'Live';
            const isLive = status === 'Live';
            const statusClass = isLive ? 'badge-live' : 'badge-archived';
            const statusDot = isLive ? '<span class="dot"></span>' : '';

            // Image
            let heroImage = project.hero_image;
            if (heroImage && !heroImage.startsWith('http')) {
                heroImage = `${API_BASE_URL}${heroImage}`;
            }
            const imageHtml = heroImage ?
                `<img src="${heroImage}" alt="${project.project_name}" onerror="this.parentElement.innerHTML='<div class=\\'image-placeholder\\'><i class=\\'fas fa-image\\'></i></div>'" />` :
                `<div class="image-placeholder"><i class="fas fa-image"></i></div>`;

            // Date
            const date = project.completion_date ?
                new Date(project.completion_date).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) :
                '';

            // Category
            const category = project.category || 'Uncategorized';

            // Build Features
            const featuresHTML = (project.features || []).map((f, i) => `
                <div class="feature-item">
                    <span class="f-number">${String(i + 1).padStart(2, '0')}</span>
                    <div class="f-content">
                        <h4>${f.title}</h4>
                        ${f.description ? `<p>${f.description}</p>` : ''}
                    </div>
                </div>
            `).join('');

            // Build Tech Stack
            const techMap = {};
            (project.techStack || []).forEach(tech => {
                const cat = tech.tech_category || 'Other';
                if (!techMap[cat]) techMap[cat] = [];
                techMap[cat].push(tech);
            });

            const techHTML = Object.entries(techMap).map(([category, items]) => `
                <div class="tech-category">
                    <div class="cat-label">${category}</div>
                    <div class="cat-items">
                        ${items.map(t => `
                            <span class="tech-tag">
                                <i class="${t.tech_icon || 'fas fa-code'}"></i>
                                ${t.tech_name}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            // Build Gallery
            const galleryImages = project.gallery || [];
            let galleryHTML = '';
            if (galleryImages.length > 0) {
                const mainImage = galleryImages[0];
                const thumbImages = galleryImages.slice(1, 4);

                let mainImgSrc = mainImage.image_path;
                if (mainImgSrc && !mainImgSrc.startsWith('http')) {
                    mainImgSrc = `${API_BASE_URL}${mainImgSrc}`;
                }

                let thumbsHTML = thumbImages.map(img => {
                    let src = img.image_path;
                    if (src && !src.startsWith('http')) {
                        src = `${API_BASE_URL}${src}`;
                    }
                    return `
                        <div class="gallery-thumb" data-index="${galleryImages.indexOf(img)}">
                            <img src="${src}" alt="${img.title || 'Screenshot'}" />
                            <div class="overlay"><i class="fas fa-search-plus"></i></div>
                        </div>
                    `;
                }).join('');

                galleryHTML = `
                    <div class="gallery-grid">
                        <div class="gallery-main" data-index="0">
                            <img src="${mainImgSrc}" alt="${mainImage.title || 'Main Screenshot'}" />
                            <div class="overlay"><i class="fas fa-search-plus"></i></div>
                        </div>
                        ${thumbsHTML}
                    </div>
                `;
            }

            // Build Timeline
            const timelineHTML = (project.timeline || []).map((step, i) => `
                <div class="timeline-step">
                    <div class="step-number">STEP ${String(i + 1).padStart(2, '0')}</div>
                    <div class="step-title">${step.step_title}</div>
                    ${step.description ? `<div class="step-desc">${step.description}</div>` : ''}
                </div>
            `).join('');

            // Build Challenges
            const challengesHTML = (project.challenges || []).map(c => `
                <div class="challenge-item">
                    <div class="challenge-left">
                        <div class="ch-icon"><i class="fas ${c.icon || 'fa-bolt'}"></i></div>
                        <h4>${c.title}</h4>
                        ${c.description ? `<p>${c.description}</p>` : ''}
                    </div>
                    <div class="challenge-right">
                        <div class="sol-label">Approach / Solution</div>
                        <p>${c.solution || 'No solution documented.'}</p>
                    </div>
                </div>
            `).join('');

            // Build Learnings
            const learningsHTML = (project.learnings || []).map((l, i) => `
                <div class="learning-item">
                    <span class="l-number">${String(i + 1).padStart(2, '0')}</span>
                    <span class="l-text">${l.learning_text}</span>
                </div>
            `).join('');

            // Build Statistics
            const statsHTML = (project.statistics || []).map(s => `
                <div class="stat-item">
                    <div class="stat-number">${s.stat_value}</div>
                    <div class="stat-label">${s.stat_title}</div>
                </div>
            `).join('');

            // Build Next Project
            let nextProjectHTML = '';
            if (project.nextProject) {
                nextProjectHTML = `
                    <div class="next-project-section">
                        <div class="next-label">Next Project</div>
                        <div class="next-name">${project.nextProject.project_name}</div>
                        <a href="detailed-project.html?id=${project.nextProject.id}" class="btn-primary">
                            View Next Project <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                `;
            }

            // Build Hero Actions
            const actionsHTML = `
                <div class="hero-actions">
                    ${project.demo_url ? `
                        <a href="${project.demo_url}" target="_blank" rel="noopener noreferrer" class="btn-primary">
                            <i class="fas fa-external-link-alt"></i> Live Project
                        </a>
                    ` : ''}
                    ${project.github_url ? `
                        <a href="${project.github_url}" target="_blank" rel="noopener noreferrer" class="btn-secondary">
                            <i class="fab fa-github"></i> View Code
                        </a>
                    ` : ''}
                </div>
            `;

            // Build Meta
            const metaHTML = `
                <div class="hero-meta">
                    ${project.role ? `
                        <div class="meta-item">
                            <span class="label">Role</span>
                            <span class="value">${project.role}</span>
                        </div>
                    ` : ''}
                    ${date ? `
                        <div class="meta-item">
                            <span class="label">Timeline</span>
                            <span class="value">${date}</span>
                        </div>
                    ` : ''}
                    <div class="meta-item">
                        <span class="label">Status</span>
                        <span class="value" style="display:flex;align-items:center;gap:6px;">
                            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${isLive ? '#22c55e' : '#6b7280'};"></span>
                            ${status}
                        </span>
                    </div>
                </div>
            `;

            // Build Meta Grid for Overview
            const metaGridHTML = `
                <div class="meta-grid">
                    ${project.role ? `
                        <div class="m-item">
                            <div class="m-label">Role</div>
                            <div class="m-value">${project.role}</div>
                        </div>
                    ` : ''}
                    ${date ? `
                        <div class="m-item">
                            <div class="m-label">Timeline</div>
                            <div class="m-value">${date}</div>
                        </div>
                    ` : ''}
                    <div class="m-item">
                        <div class="m-label">Status</div>
                        <div class="m-value">${status}</div>
                    </div>
                    <div class="m-item">
                        <div class="m-label">Category</div>
                        <div class="m-value">${category}</div>
                    </div>
                </div>
            `;

            container.innerHTML = `
                <!-- Hero -->
                <div class="case-hero reveal">
                    <div class="case-hero-wrapper">
                        <div class="case-hero-content">
                            <span class="category-label">${category.toUpperCase()}</span>
                            <h1>${project.project_name}</h1>
                            ${project.tagline ? `<p class="tagline">${project.tagline}</p>` : ''}
                            ${metaHTML}
                            ${actionsHTML}
                        </div>
                        <div class="case-hero-image">
                            ${imageHtml}
                        </div>
                    </div>
                </div>

                <!-- Overview -->
                ${project.overview ? `
                <div class="case-section reveal">
                    <div class="split-layout">
                        <div class="split-left">
                            <div class="label">01 — Overview</div>
                            <div class="number">01</div>
                        </div>
                        <div class="split-right">
                            <p>${project.overview}</p>
                            ${metaGridHTML}
                        </div>
                    </div>
                </div>
                ` : ''}

                <!-- Problem -->
                ${project.problem_statement ? `
                <div class="case-section reveal">
                    <div class="split-layout">
                        <div class="split-left">
                            <div class="label">02 — The Problem</div>
                            <div class="number">02</div>
                        </div>
                        <div class="split-right">
                            <div class="quote-text">${project.problem_statement}</div>
                        </div>
                    </div>
                </div>
                ` : ''}

                <!-- Solution -->
                ${project.solution ? `
                <div class="case-section reveal">
                    <div class="split-layout">
                        <div class="split-left">
                            <div class="label">03 — The Solution</div>
                            <div class="number">03</div>
                        </div>
                        <div class="split-right">
                            <p>${project.solution}</p>
                        </div>
                    </div>
                </div>
                ` : ''}

                <!-- Features -->
                ${project.features && project.features.length > 0 ? `
                <div class="case-section reveal">
                    <div class="section-number">04 — Features</div>
                    <h2>Key Features</h2>
                    <div class="feature-list">
                        ${featuresHTML}
                    </div>
                </div>
                ` : ''}

                <!-- Tech Stack -->
                ${project.techStack && project.techStack.length > 0 ? `
                <div class="case-section reveal">
                    <div class="section-number">05 — Technology</div>
                    <h2>Tech Stack</h2>
                    <div class="tech-grid">
                        ${techHTML}
                    </div>
                </div>
                ` : ''}

                <!-- Gallery -->
                ${galleryHTML ? `
                <div class="case-section reveal">
                    <div class="section-number">06 — Gallery</div>
                    <h2>Project Screenshots</h2>
                    ${galleryHTML}
                </div>
                ` : ''}

                <!-- Timeline -->
                ${project.timeline && project.timeline.length > 0 ? `
                <div class="case-section reveal">
                    <div class="section-number">07 — Process</div>
                    <h2>Development Process</h2>
                    <div class="timeline">
                        ${timelineHTML}
                    </div>
                </div>
                ` : ''}

                <!-- Challenges -->
                ${project.challenges && project.challenges.length > 0 ? `
                <div class="case-section reveal">
                    <div class="section-number">08 — Challenges</div>
                    <h2>Challenges & Solutions</h2>
                    ${challengesHTML}
                </div>
                ` : ''}

                <!-- Learnings -->
                ${project.learnings && project.learnings.length > 0 ? `
                <div class="case-section reveal">
                    <div class="section-number">09 — Learnings</div>
                    <h2>What I Learned</h2>
                    <div class="learnings-list">
                        ${learningsHTML}
                    </div>
                </div>
                ` : ''}

                <!-- Statistics -->
                ${project.statistics && project.statistics.length > 0 ? `
                <div class="case-section reveal">
                    <div class="section-number">10 — Statistics</div>
                    <h2>Project Statistics</h2>
                    <div class="stats-grid">
                        ${statsHTML}
                    </div>
                </div>
                ` : ''}

                <!-- CTA -->
                <div class="cta-section reveal">
                    <h2>Interested in Working Together?</h2>
                    <p>Let's create something amazing. I'm always open to new opportunities and collaborations.</p>
                    <a href="index.html#contact" class="btn-cta">
                        <i class="fas fa-paper-plane"></i> Let's Connect
                    </a>
                </div>

                <!-- Next Project -->
                ${nextProjectHTML}
            `;

            // ==================================================
            // GALLERY CLICK HANDLER
            // ==================================================
            document.querySelectorAll('.gallery-main, .gallery-thumb').forEach((el) => {
                el.addEventListener('click', () => {
                    const index = parseInt(el.dataset.index) || 0;
                    const images = project.gallery || [];
                    if (images.length > 0) {
                        window.openLightbox(images, index);
                    }
                });
            });

            // ==================================================
            // SCROLL REVEAL
            // ==================================================
            const revealElements = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

            revealElements.forEach(el => revealObserver.observe(el));
        }

        // ==================================================
        // INITIALIZE
        // ==================================================
        document.addEventListener('DOMContentLoaded', fetchProjectById);
    </script>

</body>
