<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Project Details · Ankita Chauhan</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== SIMPLE BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #f8faff;
            --bg-secondary: #ffffff;
            --bg-card: rgba(255, 255, 255, 0.7);
            --text-primary: #111827;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --border-color: rgba(108, 77, 255, 0.08);
            --shadow-sm: 0 12px 40px -8px rgba(108, 77, 255, 0.06);
            --shadow-md: 0 20px 60px -12px rgba(108, 77, 255, 0.10);
            --primary: #6C4DFF;
            --secondary: #8B5CFF;
            --light-purple: #F3F0FF;
            --radius-lg: 28px;
            --radius-pill: 60px;
            --transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        [data-theme="dark"] {
            --bg-primary: #0B1120;
            --bg-secondary: #0F172A;
            --bg-card: rgba(15, 23, 42, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(148, 163, 184, 0.08);
            --shadow-sm: 0 12px 40px -8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 20px 60px -12px rgba(0, 0, 0, 0.5);
            --light-purple: rgba(108, 77, 255, 0.15);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            overflow-x: hidden;
            transition: background 0.5s, color 0.5s;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 78px;
            padding: 0 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            transition: var(--transition);
        }
        nav.scrolled {
            background: var(--bg-secondary);
            box-shadow: var(--shadow-md);
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(108,77,255,0.25);
        }
        .nav-links {
            display: flex;
            gap: 2.2rem;
            font-weight: 500;
            font-size: 0.9rem;
            align-items: center;
        }
        .nav-links a { color: var(--text-secondary); transition: var(--transition); }
        .nav-links a:hover { color: var(--primary); }
        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 1.1rem;
            transition: var(--transition);
            background: var(--bg-card);
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: rotate(30deg);
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,.10);
            transition: .3s ease;
            text-decoration: none;
        }
        .back-btn:hover {
            transform: translateY(-3px);
            color: var(--primary);
            border-color: var(--primary);
        }
        [data-theme="dark"] .back-btn {
            background: rgba(15,23,42,.88);
            border: 1px solid rgba(255,255,255,.08);
            color: #F8FAFC;
        }
        [data-theme="dark"] .back-btn:hover {
            color: var(--primary);
        }

        @media (max-width: 768px) {
            .back-btn { width: 52px; height: 52px; min-width: 52px; padding: 0; border-radius: 50%; justify-content: center; }
            .back-btn span { display: none; }
            .back-btn i { font-size: 18px; }
        }
        @media (max-width: 480px) {
            .back-btn { width: 44px; height: 44px; min-width: 44px; bottom: 15px; left: 15px; }
            .back-btn i { font-size: 16px; }
        }

        /* ===== DETAIL PAGE ===== */
        #project-detail {
            padding: 7rem 0 5rem;
            background: var(--bg-primary);
            min-height: 100vh;
            transition: background 0.5s;
        }

        .detail-header {
            margin-bottom: 2.5rem;
        }

        .detail-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            transition: color 0.5s;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            transition: color 0.5s;
        }
        .detail-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-meta i {
            color: var(--primary);
            opacity: 0.7;
        }

        .detail-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .detail-status.live { background: #22c55e; color: #fff; }
        .detail-status.archived { background: #6b7280; color: #fff; }
        .detail-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            animation: dotBlink 1.5s ease-in-out infinite;
        }
        .detail-status.archived .dot { animation: none; background: #d1d5db; }
        @keyframes dotBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .detail-content {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3rem;
            margin-top: 2rem;
            align-items: start;
        }

        .detail-image {
            border-radius: 20px;
            overflow: hidden;
            background: var(--light-purple);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: all 0.5s;
        }
        .detail-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
        .detail-image .placeholder {
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: var(--primary);
            opacity: 0.3;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .detail-description {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.8;
            transition: color 0.5s;
        }

        .detail-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px 24px;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(8px);
            transition: all 0.5s;
        }
        .detail-section h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.5s;
        }
        .detail-section h4 i { color: var(--primary); }
        .detail-section p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.7; }

        .tech-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        .tech-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: var(--light-purple);
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .tech-item i { font-size: 1rem; color: var(--primary); }
        .tech-item:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(108,77,255,0.1); }

        .detail-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
        }
        .detail-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: 1.5px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            text-decoration: none;
        }
        .detail-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 8px 24px rgba(108,77,255,0.1);
        }
        .detail-btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(108,77,255,0.25);
        }
        .detail-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(108,77,255,0.35);
        }

        /* Loading & Error */
        .loading-state, .error-state, .not-found-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
            min-height: 400px;
        }
        .loading-state .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-state p, .error-state p, .not-found-state p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 500;
        }
        .error-state i, .not-found-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .error-state i { color: #ef4444; }
        .not-found-state i { color: var(--text-muted); }
        .error-state small {
            display: block;
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Footer */
        footer {
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            transition: all 0.5s;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .detail-content { grid-template-columns: 1fr; gap: 2rem; }
            .detail-image { max-width: 600px; margin: 0 auto; }
        }
        @media (max-width: 768px) {
            nav { padding: 0 20px; height: 70px; }
            .nav-links { display: none; }
            #project-detail { padding: 6rem 0 3rem; }
            .detail-title { font-size: 1.8rem; }
            .detail-meta { font-size: 0.85rem; gap: 12px 16px; }
            .container { padding: 0 1.2rem; }
        }
        @media (max-width: 480px) {
            .container { padding: 0 1rem; }
            .detail-title { font-size: 1.5rem; }
            .detail-meta { font-size: 0.75rem; flex-direction: column; gap: 6px; }
            .detail-section { padding: 14px 14px; }
            .detail-description { font-size: 0.95rem; }
            .tech-item { font-size: 0.7rem; padding: 4px 10px; }
            .detail-btn { padding: 6px 14px; font-size: 0.75rem; }
            .detail-image .placeholder { height: 160px; font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <nav id="navbar">
        <div class="nav-logo">
            <span class="logo-icon">AC</span>
            <span>Full Stack Developer</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="index.html#projects">Projects</a></li>
            <li><a href="index.html#contact">Contact</a></li>
            <li><a href="index.html#contact" class="nav-connect" style="background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff!important;padding:0.5rem 1.6rem!important;border-radius:60px;font-weight:600;font-size:0.85rem;box-shadow:0 4px 16px rgba(108,77,255,0.25);">Let's Connect</a></li>
        </ul>
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button>
    </nav>

    <!-- ===== BACK BUTTON ===== -->
    <a href="index.html#projects" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back</span>
    </a>

    <!-- ===== PROJECT DETAIL ===== -->
    <section id="project-detail">
        <div class="container">
            <div id="projectContent">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading project details...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>© 2026 Ankita Ramvilas Chauhan · Built with <span style="color:var(--primary);">❤</span></p>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // ==================================================
        // THEME TOGGLE
        // ==================================================
        (function() {
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const html = document.documentElement;
            const get = () => localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            const set = (t) => { html.setAttribute('data-theme', t); localStorage.setItem('theme', t); icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon'; };
            set(get());
            toggle.addEventListener('click', () => { const cur = html.getAttribute('data-theme'); set(cur === 'dark' ? 'light' : 'dark'); });
        })();

        // ==================================================
        // NAVBAR SCROLL
        // ==================================================
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 20); });

        // ==================================================
        // API CONFIGURATION
        // ==================================================
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5000'
            : 'https://portfolio-3-l63x.onrender.com';

        const API_URL = `${API_BASE_URL}/api`;

        // ==================================================
        // GET PROJECT ID FROM URL
        // ==================================================
        function getProjectId() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            console.log('🔎 Project ID from URL:', id);
            return id;
        }

        // ==================================================
        // FETCH PROJECT BY ID
        // ==================================================
        async function fetchProjectById() {
            const projectId = getProjectId();
            const content = document.getElementById('projectContent');

            // Validate ID
            if (!projectId) {
                content.innerHTML = `
                    <div class="not-found-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Project ID is missing.</p>
                    </div>
                `;
                return;
            }

            const idNum = Number(projectId);
            if (!Number.isInteger(idNum) || idNum <= 0) {
                content.innerHTML = `
                    <div class="not-found-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Invalid project ID format.</p>
                    </div>
                `;
                return;
            }

            try {
                // Show loading
                content.innerHTML = `
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>Loading project details...</p>
                    </div>
                `;

                const url = `${API_URL}/projects/${idNum}`;
                console.log('🌐 Fetching:', url);

                const response = await fetch(url);
                console.log('📡 Response status:', response.status);

                // Handle 404
                if (response.status === 404) {
                    content.innerHTML = `
                        <div class="not-found-state">
                            <i class="fas fa-folder-open"></i>
                            <p>Project Not Found.</p>
                            <small>The requested project does not exist in the database.</small>
                        </div>
                    `;
                    return;
                }

                // Handle other errors
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                console.log('📦 API response:', data);

                // Handle different response formats
                let project = null;
                if (data.success && data.project) {
                    project = data.project;
                } else if (data.id || data.project_name) {
                    project = data;
                } else if (data.success === false) {
                    throw new Error(data.message || 'Failed to load project');
                }

                if (!project) {
                    throw new Error('Invalid response format from server');
                }

                console.log('✅ Project received:', project);

                // Render the project
                renderProject(project);

            } catch (error) {
                console.error('❌ Error:', error);
                content.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Unable to load project details.</p>
                        <small>${error.message}</small>
                    </div>
                `;
            }
        }

        // ==================================================
        // RENDER PROJECT
        // ==================================================
        function renderProject(project) {
            const content = document.getElementById('projectContent');

            // Status
            const status = project.status || 'Live';
            const isLive = status === 'Live';
            const statusClass = isLive ? 'live' : 'archived';

            // Image
            let imageHtml = '';
            if (project.hero_image) {
                const imageUrl = project.hero_image.startsWith('http')
                    ? project.hero_image
                    : `${API_BASE_URL}${project.hero_image}`;
                imageHtml = `<img src="${imageUrl}" alt="${project.project_name}" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'><i class=\\'fas fa-image\\'></i></div>'">`;
            } else if (project.banner_image) {
                const imageUrl = project.banner_image.startsWith('http')
                    ? project.banner_image
                    : `${API_BASE_URL}${project.banner_image}`;
                imageHtml = `<img src="${imageUrl}" alt="${project.project_name}" onerror="this.parentElement.innerHTML='<div class=\\'placeholder\\'><i class=\\'fas fa-image\\'></i></div>'">`;
            } else {
                imageHtml = `<div class="placeholder"><i class="fas fa-image"></i></div>`;
            }

            // Date
            const date = project.completion_date
                ? new Date(project.completion_date).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })
                : '';

            // Tech Stack
            let techHtml = '';
            if (project.techStack && Array.isArray(project.techStack) && project.techStack.length > 0) {
                techHtml = `
                    <div class="tech-grid">
                        ${project.techStack.map(tech => `
                            <span class="tech-item">
                                <i class="${tech.tech_icon || 'fas fa-code'}"></i>
                                ${tech.tech_name}
                            </span>
                        `).join('')}
                    </div>
                `;
            }

            // Features
            let featuresHtml = '';
            if (project.features && Array.isArray(project.features) && project.features.length > 0) {
                featuresHtml = `
                    <div class="detail-section">
                        <h4><i class="fas fa-check-circle"></i> Key Features</h4>
                        <ul style="list-style:none;padding:0;">
                            ${project.features.map(f => `
                                <li style="padding:4px 0;display:flex;align-items:flex-start;gap:10px;color:var(--text-secondary);font-size:0.95rem;line-height:1.7;">
                                    <i class="fas fa-chevron-right" style="color:var(--primary);margin-top:4px;font-size:0.8rem;"></i>
                                    <div>
                                        <strong>${f.title}</strong>
                                        ${f.description ? `<p style="margin:0;">${f.description}</p>` : ''}
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            // Actions
            let actionsHtml = '';
            if (project.github_url || project.demo_url) {
                actionsHtml = `
                    <div class="detail-actions">
                        ${project.github_url ? `
                            <a href="${project.github_url}" target="_blank" rel="noopener noreferrer" class="detail-btn">
                                <i class="fab fa-github"></i> View Code
                            </a>
                        ` : ''}
                        ${project.demo_url ? `
                            <a href="${project.demo_url}" target="_blank" rel="noopener noreferrer" class="detail-btn primary">
                                <i class="fas fa-external-link-alt"></i> Live Demo
                            </a>
                        ` : ''}
                    </div>
                `;
            }

            content.innerHTML = `
                <div class="detail-header">
                    <h1 class="detail-title">${project.project_name || 'Untitled Project'}</h1>
                    <div class="detail-meta">
                        <span><i class="fas fa-tag"></i> ${project.category || 'Uncategorized'}</span>
                        ${date ? `<span><i class="fas fa-calendar-alt"></i> ${date}</span>` : ''}
                        ${project.role ? `<span><i class="fas fa-user-cog"></i> ${project.role}</span>` : ''}
                        <span class="detail-status ${statusClass}">
                            <span class="dot"></span> ${status}
                        </span>
                    </div>
                </div>

                <div class="detail-content">
                    <div class="detail-image">
                        ${imageHtml}
                    </div>

                    <div class="detail-info">
                        ${project.overview || project.description ? `
                            <p class="detail-description">${project.overview || project.description}</p>
                        ` : ''}

                        ${project.problem_statement ? `
                            <div class="detail-section">
                                <h4><i class="fas fa-exclamation-triangle"></i> Problem Statement</h4>
                                <p>${project.problem_statement}</p>
                            </div>
                        ` : ''}

                        ${project.solution ? `
                            <div class="detail-section">
                                <h4><i class="fas fa-lightbulb"></i> Solution</h4>
                                <p>${project.solution}</p>
                            </div>
                        ` : ''}

                        ${techHtml ? `
                            <div class="detail-section">
                                <h4><i class="fas fa-code"></i> Technology Stack</h4>
                                ${techHtml}
                            </div>
                        ` : ''}

                        ${featuresHtml}

                        ${actionsHtml}
                    </div>
                </div>
            `;
        }

        // ==================================================
        // LOAD PROJECT ON PAGE LOAD
        // ==================================================
        document.addEventListener('DOMContentLoaded', fetchProjectById);
    </script>

</body>
